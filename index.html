<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notes | matteushomepage</title>
    <meta
      name="description"
      content="Simple notes application created by matteushomepage."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗒️</text></svg>"
    />
    <meta
      name="google-site-verification"
      content="o0odX19KzQ29Id3e3SSXmlBCz7bFFEo5cqlWI9CvjJk"
    />
    <meta name="theme-color" content="#ffffff" />

    <style>
      :root {
        --page: #f5f5f4;
        --surface: #ffffff;
        --surface-alt: #f0f0ef;
        --text: #222222;
        --muted: #777777;
        --border: #d5d5d3;
        --button: #ededeb;
        --shadow: 0 2px 0 #e1e1df, 0 5px 16px #00000008;
        --focus: #777777;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: flex;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 86px 18px 105px;
        background: var(--page);
        color: var(--text);
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        transition:
          background 0.25s,
          color 0.25s;
      }

      body.dark-mode {
        --page: #202020;
        --surface: #292929;
        --surface-alt: #242424;
        --text: #f1f1f1;
        --muted: #aaaaaa;
        --border: #414141;
        --button: #343434;
        --shadow: 0 2px 0 #181818, 0 5px 16px #00000022;
        --focus: #aaaaaa;
      }

      main {
        width: min(720px, 100%);
      }

      .section-label {
        display: block;
        margin: 0 0 9px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 650;
        letter-spacing: 0.02em;
      }

      .search-panel,
      .editor-panel,
      .note {
        background: var(--surface);
        border: 1px solid var(--border);
        border-top-color: #e8e8e7;
        border-radius: 9px;
        box-shadow: var(--shadow);
      }

      .dark-mode .search-panel,
      .dark-mode .editor-panel,
      .dark-mode .note {
        border-top-color: #4a4a4a;
      }

      .search-panel {
        margin-bottom: 17px;
        padding: 15px 17px;
      }

      #searchInput {
        width: 100%;
        padding: 12px 13px;
        border: 1px solid var(--border);
        border-radius: 6px;
        outline: none;
        background: var(--surface-alt);
        color: var(--text);
        font:
          15px system-ui,
          sans-serif;
      }

      .editor-panel {
        margin-bottom: 25px;
        padding: 19px;
      }

      .input-container {
        display: flex;
        flex-direction: column;
        gap: 11px;
      }

      #noteTitle {
        width: 100%;
        padding: 13px 14px;
        border: 1px solid var(--border);
        border-radius: 6px;
        outline: none;
        background: var(--surface-alt);
        color: var(--text);
        font:
          600 17px system-ui,
          sans-serif;
      }

      #noteTitle::placeholder {
        font-weight: 400;
        color: var(--muted);
      }

      #noteInput {
        width: 100%;
        min-height: 170px;
        padding: 14px;
        border: 1px solid var(--border);
        border-radius: 6px;
        outline: none;
        resize: vertical;
        background: var(--surface);
        color: var(--text);
        font:
          15px/1.6 system-ui,
          sans-serif;
      }

      #searchInput:focus,
      #noteTitle:focus,
      #noteInput:focus,
      #loginBox input:focus {
        border-color: var(--focus);
        box-shadow: 0 0 0 2px #8882;
      }

      button {
        padding: 10px 13px;
        cursor: pointer;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--button);
        color: var(--text);
        font:
          14px system-ui,
          sans-serif;
        transition:
          background 0.2s,
          border-color 0.2s;
      }

      button:hover {
        background: var(--surface-alt);
      }

      button:disabled {
        cursor: wait;
        opacity: 0.6;
      }

      #saveBtn {
        padding: 12px 16px;
        border: 1px solid var(--border);
        background: var(--button);
        color: var(--text);
        font-weight: 650;
        box-shadow:
          inset 0 1px 0 #ffffff55,
          0 1px 0 #0000000b;
      }

      .dark-mode #saveBtn {
        box-shadow:
          inset 0 1px 0 #ffffff0a,
          0 1px 0 #0003;
      }

      #cancelEditBtn {
        background: transparent;
      }

      #notes-list {
        width: 100%;
        margin: 0;
        padding: 0 0 80px;
        list-style: none;
      }

      .note {
        margin: 0 0 13px;
        padding: 17px 18px;
        overflow-wrap: anywhere;
      }

      .note h3 {
        margin: 0 0 10px;
        color: var(--text);
        font-size: 18px;
        font-weight: 650;
        line-height: 1.4;
      }

      .note p {
        margin: 0;
        color: var(--text);
        font-size: 15px;
        line-height: 1.6;
        white-space: pre-wrap;
      }

      .actions {
        display: flex;
        gap: 8px;
        margin-top: 14px;
        padding-top: 12px;
        border-top: 1px solid var(--border);
      }

      .actions button {
        padding: 7px 12px;
        font-size: 13px;
      }

      #authBar {
        position: fixed;
        top: 15px;
        right: 15px;
        z-index: 1000;
        display: flex;
        align-items: center;
        gap: 9px;
        max-width: calc(100vw - 30px);
      }

      #loginBtn,
      #hubBtn {
        padding: 8px 13px;
        border-radius: 6px;
        font-size: 13px;
      }

      #userName {
        max-width: 160px;
        overflow: hidden;
        color: var(--muted);
        font-size: 13px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      footer {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        padding: 15px 0;
        border-top: 1px solid var(--border);
        background: var(--page);
        color: var(--muted);
        text-align: center;
        font-size: 13px;
      }

      #mobileThemeBtn {
        display: none;
      }

      #loginModal {
        position: fixed;
        inset: 0;
        z-index: 2000;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 15px;
        background: #0009;
      }

      #loginModal.visible {
        display: flex;
      }

      #loginBox {
        position: relative;
        width: 100%;
        max-width: 360px;
        padding: 27px 25px 25px;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: var(--surface);
        color: var(--text);
        box-shadow: 0 10px 35px #0003;
      }

      #closeLogin {
        position: absolute;
        top: 9px;
        right: 10px;
        width: 32px;
        height: 32px;
        padding: 0;
        border: 0;
        border-radius: 5px;
        background: transparent;
        color: var(--muted);
        font-size: 24px;
        line-height: 1;
      }

      #closeLogin:hover {
        background: var(--surface-alt);
        color: var(--text);
      }

      #loginBox h2 {
        margin: 0 0 8px;
        text-align: center;
        font:
          650 22px system-ui,
          sans-serif;
      }

      #loginDescription {
        margin-bottom: 20px;
        color: var(--muted);
        text-align: center;
        font-size: 14px;
      }

      #loginBox input {
        display: block;
        width: 100%;
        margin-bottom: 12px;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 6px;
        outline: none;
        background: var(--surface-alt);
        color: var(--text);
        font:
          15px system-ui,
          sans-serif;
      }

      #loginSubmit {
        width: 100%;
        margin-top: 5px;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--button);
        color: var(--text);
        font-size: 15px;
        font-weight: 600;
      }

      #loginStatus {
        margin-top: 12px;
        color: #c0392b;
        text-align: center;
        font-size: 13px;
        overflow-wrap: break-word;
      }

      @media (max-width: 768px) {
        body {
          padding: 78px 13px 85px;
        }

        main {
          width: 100%;
        }

        .search-panel {
          margin-bottom: 14px;
          padding: 13px 14px;
        }

        .editor-panel {
          margin-bottom: 20px;
          padding: 15px;
        }

        #noteInput {
          min-height: 145px;
        }

        #mobileThemeBtn {
          position: fixed;
          top: 10px;
          left: 10px;
          z-index: 1100;
          display: flex;
          width: 38px;
          height: 38px;
          align-items: center;
          justify-content: center;
          padding: 0;
          border-radius: 7px;
          background: var(--surface);
          box-shadow: var(--shadow);
          font-size: 18px;
        }

        #authBar {
          top: 10px;
          right: 10px;
          gap: 6px;
        }

        #userName {
          max-width: 90px;
          font-size: 12px;
        }

        #loginBtn,
        #hubBtn {
          padding: 7px 9px;
          font-size: 12px;
        }

        footer p {
          display: none;
        }

        footer {
          padding: 9px 0;
          font-size: 11px;
        }
      }
    </style>
  </head>

  <body>
    <div id="authBar">
      <span id="userName"></span>
      <button id="loginBtn">Log in</button>
      <button
        id="hubBtn"
        type="button"
        onclick="
          location.href = 'https://matteushomepage.github.io/Website-Hub'
        "
      >
        To Hub
      </button>
    </div>

    <button id="mobileThemeBtn" type="button" aria-label="Toggle theme">
      🌓
    </button>

    <main>
      <section class="search-panel">
        <label class="section-label" for="searchInput">Search</label>
        <input
          id="searchInput"
          type="search"
          placeholder="Search notes"
          autocomplete="off"
        />
      </section>

      <section class="editor-panel">
        <label class="section-label" for="noteTitle">Write something</label>

        <div class="input-container">
          <input
            id="noteTitle"
            maxlength="160"
            placeholder="Title (optional)"
          />
          <textarea id="noteInput" placeholder="Write a note"></textarea>

          <div style="display: flex; gap: 9px; align-items: center">
            <button id="saveBtn" style="flex: 1">Create note</button>
            <button id="cancelEditBtn" type="button" style="display: none">
              Cancel edit
            </button>
          </div>
        </div>
      </section>

      <section>
        <span class="section-label">Your notes</span>
        <ul id="notes-list"></ul>
      </section>
    </main>

    <footer>
      <p>Created by Matteus Aydin 2026</p>
      <p style="font-size: 12px; opacity: 0.8; margin-top: 5px">
        Press 'M' to toggle theme
      </p>
    </footer>

    <div
      id="loginModal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="loginHeading"
    >
      <div id="loginBox">
        <button id="closeLogin" type="button" aria-label="Close login">
          ×
        </button>
        <h2 id="loginHeading">Log in</h2>
        <p id="loginDescription">Use your email and password.</p>

        <form id="loginForm">
          <input
            type="email"
            id="emailInput"
            placeholder="Email address"
            autocomplete="email"
            required
          />
          <input
            type="password"
            id="passwordInput"
            placeholder="Password"
            autocomplete="current-password"
            minlength="6"
            required
          />
          <button type="submit" id="loginSubmit">Continue</button>
        </form>

        <div id="loginStatus" role="status" aria-live="polite"></div>
      </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyCnzFHFx-LkADAuUK42s7Y58sn24AVCT0w",
        authDomain: "notes-matteus.firebaseapp.com",
        projectId: "notes-matteus",
        storageBucket: "notes-matteus.firebasestorage.app",
        messagingSenderId: "407855896537",
        appId: "1:407855896537:web:5b09180460472989096bc8",
      };

      firebase.initializeApp(firebaseConfig);

      const auth = firebase.auth();
      const db = firebase.firestore();

      const elements = {
        title: document.getElementById("noteTitle"),
        input: document.getElementById("noteInput"),
        list: document.getElementById("notes-list"),
        search: document.getElementById("searchInput"),
        loginButton: document.getElementById("loginBtn"),
        userName: document.getElementById("userName"),
        modal: document.getElementById("loginModal"),
        loginForm: document.getElementById("loginForm"),
        email: document.getElementById("emailInput"),
        password: document.getElementById("passwordInput"),
        loginSubmit: document.getElementById("loginSubmit"),
        loginStatus: document.getElementById("loginStatus"),
        loginHeading: document.getElementById("loginHeading"),
        loginDescription: document.getElementById("loginDescription"),
        saveButton: document.getElementById("saveBtn"),
        cancelEdit: document.getElementById("cancelEditBtn"),
      };

      const PENDING_EMAIL_KEY = "notesPendingEmail";

      let currentUser = null;
      let notesListener = null;
      let notes = [];
      let editingId = null;
      let passwordSetupUser = null;
      let completingEmailLink = false;

      if (localStorage.getItem("darkMode") === "enabled") {
        document.body.classList.add("dark-mode");
      }

      function toggleTheme() {
        document.body.classList.toggle("dark-mode");

        localStorage.setItem(
          "darkMode",
          document.body.classList.contains("dark-mode")
            ? "enabled"
            : "disabled",
        );
      }

      document
        .getElementById("mobileThemeBtn")
        .addEventListener("click", toggleTheme);

      document.addEventListener("keydown", (event) => {
        if (
          !["INPUT", "TEXTAREA"].includes(event.target.tagName) &&
          event.key.toLowerCase() === "m"
        ) {
          toggleTheme();
        }

        if (
          event.key === "Escape" &&
          elements.modal.classList.contains("visible")
        ) {
          closeLoginModal();
        }
      });

      function openLoginModal() {
        elements.modal.classList.add("visible");
        elements.loginStatus.textContent = "";
        elements.loginHeading.textContent = "Log in";
        elements.loginDescription.textContent = "Use your email and password.";
        elements.loginSubmit.textContent = "Continue";
        elements.email.readOnly = false;
        elements.password.autocomplete = "current-password";
        elements.password.focus();
      }

      function closeLoginModal() {
        if (completingEmailLink || passwordSetupUser) {
          return;
        }

        elements.modal.classList.remove("visible");
        elements.loginStatus.textContent = "";
        elements.loginForm.reset();
        elements.email.readOnly = false;
      }

      elements.loginButton.addEventListener("click", () => {
        if (currentUser) {
          auth.signOut().catch((error) => {
            alert("Log out failed: " + error.message);
          });
        } else {
          openLoginModal();
        }
      });

      document
        .getElementById("closeLogin")
        .addEventListener("click", closeLoginModal);

      elements.modal.addEventListener("click", (event) => {
        if (event.target === elements.modal) {
          closeLoginModal();
        }
      });

      function showLoginStatus(message, success = false) {
        elements.loginStatus.textContent = message;
        elements.loginStatus.style.color = success ? "#39804a" : "#c0392b";
      }

      function getAuthErrorMessage(error) {
        const messages = {
          "auth/invalid-email": "Enter a valid email address.",
          "auth/weak-password": "Use a password with at least 6 characters.",
          "auth/too-many-requests":
            "Too many attempts. Please try again later.",
          "auth/network-request-failed":
            "Network error. Check your connection and try again.",
          "auth/operation-not-allowed":
            "Email/password and email-link sign-in must be enabled in Firebase Authentication.",
          "auth/expired-action-code":
            "This email link has expired. Please request a new one.",
          "auth/invalid-action-code":
            "This email link is invalid or has already been used. Please request a new one.",
          "auth/credential-already-in-use":
            "This email already has a password account. Try logging in again.",
        };

        return messages[error.code] || error.message || "Something went wrong.";
      }

      function setLoginBusy(busy, message = "Continue") {
        elements.loginSubmit.disabled = busy;
        elements.loginSubmit.textContent = busy ? message : "Continue";
      }

      function getContinueUrl() {
        const url = new URL(window.location.href);
        url.search = "";
        url.hash = "";
        return url.toString();
      }

      async function sendSignInLink(email) {
        const actionCodeSettings = {
          url: getContinueUrl(),
          handleCodeInApp: true,
        };

        await auth.sendSignInLinkToEmail(email, actionCodeSettings);

        localStorage.setItem(PENDING_EMAIL_KEY, email);

        showLoginStatus(
          "Check your inbox for the sign-in link. If it isn't there, check your spam or junk folder.",
          true,
        );
      }

      async function signInOrStartRegistration(email, password) {
        try {
          const result = await auth.signInWithEmailAndPassword(email, password);

          if (result.user.emailVerified) {
            closeLoginModal();
            return;
          }

          await auth.signOut();
          await sendSignInLink(email);
        } catch (error) {
          const fallbackCodes = [
            "auth/user-not-found",
            "auth/invalid-credential",
            "auth/wrong-password",
          ];

          if (fallbackCodes.includes(error.code)) {
            await sendSignInLink(email);
            return;
          }

          throw error;
        }
      }

      elements.loginForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        const email = elements.email.value.trim().toLowerCase();
        const password = elements.password.value;

        if (!email || password.length < 6) {
          showLoginStatus(
            "Enter your email and a password with at least 6 characters.",
          );
          return;
        }

        if (passwordSetupUser) {
          await finishPasswordSetup(email, password);
          return;
        }

        showLoginStatus("");
        setLoginBusy(true, "Please wait...");

        try {
          await signInOrStartRegistration(email, password);
        } catch (error) {
          showLoginStatus(getAuthErrorMessage(error));
        } finally {
          setLoginBusy(false);
        }
      });

      async function finishPasswordSetup(email, password) {
        if (password.length < 6) {
          showLoginStatus("Use a password with at least 6 characters.");
          return;
        }

        setLoginBusy(true, "Setting password...");

        try {
          const credential = firebase.auth.EmailAuthProvider.credential(
            email,
            password,
          );

          await passwordSetupUser.linkWithCredential(credential);

          passwordSetupUser = null;
          completingEmailLink = false;
          finishEmailLinkCleanup();
          elements.modal.classList.remove("visible");
          elements.loginForm.reset();
          elements.email.readOnly = false;
        } catch (error) {
          showLoginStatus(getAuthErrorMessage(error));
        } finally {
          setLoginBusy(false);
        }
      }

      function finishEmailLinkCleanup() {
        localStorage.removeItem(PENDING_EMAIL_KEY);

        const cleanUrl = window.location.origin + window.location.pathname;
        window.history.replaceState({}, document.title, cleanUrl);
      }

      async function completeEmailLink() {
        if (!auth.isSignInWithEmailLink(window.location.href)) {
          return;
        }

        completingEmailLink = true;

        let email = localStorage.getItem(PENDING_EMAIL_KEY);

        if (!email) {
          email = window.prompt(
            "Enter the email address where you received the link:",
          );
        }

        if (!email) {
          completingEmailLink = false;
          openLoginModal();
          showLoginStatus("Enter the email address that received the link.");
          return;
        }

        email = email.trim().toLowerCase();

        try {
          const result = await auth.signInWithEmailLink(
            email,
            window.location.href,
          );

          const hasPasswordProvider = result.user.providerData.some(
            (provider) => provider.providerId === "password",
          );

          if (!hasPasswordProvider) {
            passwordSetupUser = result.user;

            elements.modal.classList.add("visible");
            elements.loginHeading.textContent = "Set your password";
            elements.loginDescription.textContent =
              "Choose a password for future logins.";
            elements.email.value = email;
            elements.email.readOnly = true;
            elements.password.value = "";
            elements.password.autocomplete = "new-password";
            elements.loginSubmit.textContent = "Set password";

            showLoginStatus(
              "Your email is verified. Set a password to finish.",
              true,
            );
            completingEmailLink = false;
            return;
          }

          finishEmailLinkCleanup();
          completingEmailLink = false;
          elements.modal.classList.remove("visible");
        } catch (error) {
          completingEmailLink = false;
          openLoginModal();
          showLoginStatus(getAuthErrorMessage(error));
        }
      }

      elements.saveButton.addEventListener("click", async () => {
        if (!currentUser) {
          openLoginModal();
          return;
        }

        const title = elements.title.value.trim();
        const text = elements.input.value.trim();

        if (!title && !text) {
          return;
        }

        elements.saveButton.disabled = true;

        try {
          const timestamp = Date.now();

          const noteData = {
            uid: currentUser.uid,
            title,
            text,
            time: timestamp,
            updatedAt: timestamp,
          };

          if (editingId) {
            await db.collection("notes").doc(editingId).update(noteData);
          } else {
            await db.collection("notes").add(noteData);
          }

          resetEditor();
        } catch (error) {
          alert("Could not save note: " + error.message);
        } finally {
          elements.saveButton.disabled = false;
        }
      });

      function resetEditor() {
        editingId = null;
        elements.title.value = "";
        elements.input.value = "";
        elements.saveButton.textContent = "Create note";
        elements.cancelEdit.style.display = "none";
      }

      elements.cancelEdit.addEventListener("click", resetEditor);
      elements.search.addEventListener("input", renderNotes);

      function renderNotes() {
        elements.list.innerHTML = "";

        const searchTerms = elements.search.value
          .trim()
          .toLocaleLowerCase()
          .split(/\s+/)
          .filter(Boolean);

        const filteredNotes = notes.filter((note) => {
          const title = (note.title || "").toLocaleLowerCase();
          const text = (note.text || "").toLocaleLowerCase();

          return searchTerms.every(
            (term) => title.includes(term) || text.includes(term),
          );
        });

        filteredNotes.forEach((note) => {
          const card = document.createElement("li");
          card.className = "note";

          if (note.title) {
            const heading = document.createElement("h3");
            heading.textContent = note.title;
            card.appendChild(heading);
          }

          const content = document.createElement("p");
          content.textContent = note.text || "";
          card.appendChild(content);

          const actions = document.createElement("div");
          actions.className = "actions";

          const editButton = document.createElement("button");
          editButton.type = "button";
          editButton.textContent = "Edit";

          editButton.addEventListener("click", () => {
            editingId = note.id;
            elements.title.value = note.title || "";
            elements.input.value = note.text || "";
            elements.saveButton.textContent = "Update note";
            elements.cancelEdit.style.display = "inline-block";

            window.scrollTo({
              top: 0,
              behavior: "smooth",
            });
          });

          const deleteButton = document.createElement("button");
          deleteButton.type = "button";
          deleteButton.textContent = "Delete";

          deleteButton.addEventListener("click", async () => {
            if (!confirm("Delete this note permanently?")) {
              return;
            }

            try {
              await db.collection("notes").doc(note.id).delete();
            } catch (error) {
              alert("Could not delete note: " + error.message);
            }
          });

          actions.append(editButton, deleteButton);
          card.appendChild(actions);
          elements.list.appendChild(card);
        });
      }

      function loadNotes() {
        if (notesListener) {
          notesListener();
          notesListener = null;
        }

        notes = [];
        renderNotes();

        if (!currentUser) {
          return;
        }

        notesListener = db
          .collection("notes")
          .where("uid", "==", currentUser.uid)
          .onSnapshot(
            (snapshot) => {
              notes = [];

              snapshot.forEach((document) => {
                notes.push({
                  id: document.id,
                  ...document.data(),
                });
              });

              notes.sort((a, b) => {
                return (
                  (b.updatedAt || b.time || 0) - (a.updatedAt || a.time || 0)
                );
              });

              renderNotes();
            },
            (error) => {
              alert("Could not load notes: " + error.message);
            },
          );
      }

      auth.onAuthStateChanged((user) => {
        if (user && user.emailVerified) {
          currentUser = user;
          elements.userName.textContent = user.email || "";
          elements.loginButton.textContent = "Log out";
          loadNotes();
          return;
        }

        if (user && !user.emailVerified) {
          auth.signOut().catch(console.error);
        }

        currentUser = null;
        elements.userName.textContent = "";
        elements.loginButton.textContent = "Log in";
        elements.list.innerHTML = "";
        notes = [];

        if (notesListener) {
          notesListener();
          notesListener = null;
        }
      });

      completeEmailLink().catch((error) => {
        completingEmailLink = false;
        console.error("Email link completion failed:", error);
      });
    </script>
  </body>
</html>
